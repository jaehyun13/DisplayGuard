name: Build installer

# Builds the Spectra Display Studio installer on Windows.
# - Push a tag like v1.0.0  -> builds and publishes a GitHub Release with the installer attached.
# - Manual run (workflow_dispatch) -> builds and uploads the installer as an artifact;
#   with "publish" checked it also creates the vX.Y.Z tag and publishes the GitHub Release.
#
# This CI build is the integration point for SignPath Foundation free code signing:
# once the SignPath project is connected, it signs the artifact produced by this workflow.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true
        default: '2.0.0'
      publish:
        description: 'Create the vX.Y.Z tag and publish the GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "${{ github.event.inputs.version }}"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Build installer
        shell: pwsh
        run: .\build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectraDisplayStudio-Setup-${{ steps.ver.outputs.version }}
          path: Output/SpectraDisplayStudio-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      - name: Find release notes
        id: notes
        if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
        shell: pwsh
        run: |
          $f = "RELEASE_NOTES_v${{ steps.ver.outputs.version }}.md"
          if (Test-Path $f) { "path=$f" | Out-File -FilePath $env:GITHUB_OUTPUT -Append }

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Spectra Display Studio v${{ steps.ver.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: Output/SpectraDisplayStudio-Setup-${{ steps.ver.outputs.version }}.exe
          draft: false
